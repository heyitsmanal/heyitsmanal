<svg width="900" height="650" viewBox="0 0 900 650" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="650" rx="28" fill="#0d1117"/>
  <text x="450" y="70" text-anchor="middle" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Stack Radar</text>
  <text x="450" y="104" text-anchor="middle" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="16">Technologies in my current stack</text>

  <g stroke="#30363d" stroke-width="2" fill="none">
    <polygon points="450,140 640,250 640,470 450,580 260,470 260,250"/>
    <polygon points="450,190 597,275 597,445 450,530 303,445 303,275"/>
    <polygon points="450,240 554,300 554,420 450,480 346,420 346,300"/>
    <line x1="450" y1="360" x2="450" y2="140"/>
    <line x1="450" y1="360" x2="640" y2="250"/>
    <line x1="450" y1="360" x2="640" y2="470"/>
    <line x1="450" y1="360" x2="450" y2="580"/>
    <line x1="450" y1="360" x2="260" y2="470"/>
    <line x1="450" y1="360" x2="260" y2="250"/>
  </g>

  <!-- equal-radius stack polygon: avoids fake proficiency ranking -->
  <polygon points="450,190 597,275 597,445 450,530 303,445 303,275"
           fill="#1f6feb" fill-opacity="0.20" stroke="#58a6ff" stroke-width="4"/>

  <g fill="#58a6ff">
    <circle cx="450" cy="190" r="7"/>
    <circle cx="597" cy="275" r="7"/>
    <circle cx="597" cy="445" r="7"/>
    <circle cx="450" cy="530" r="7"/>
    <circle cx="303" cy="445" r="7"/>
    <circle cx="303" cy="275" r="7"/>
  </g>

  <g fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
    <text x="450" y="126" text-anchor="middle">Java</text>
    <text x="680" y="245" text-anchor="start">Spring Boot</text>
    <text x="680" y="485" text-anchor="start">Quarkus</text>
    <text x="450" y="615" text-anchor="middle">Django</text>
    <text x="220" y="485" text-anchor="end">.NET</text>
    <text x="220" y="245" text-anchor="end">React</text>
  </g>

  <text x="450" y="640" text-anchor="middle" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="14">
    Technologies shown equally — not ranked by proficiency
  </text>
</svg>
