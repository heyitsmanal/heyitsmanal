<svg width="900" height="650" viewBox="0 0 900 650" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="650" rx="28" fill="#0d1117"/>
  <text x="450" y="70" text-anchor="middle" fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Skill Radar</text>
  <text x="450" y="104" text-anchor="middle" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="16">Current development areas</text>

  <!-- grid -->
  <g stroke="#30363d" stroke-width="2" fill="none">
    <polygon points="450,145 664,300 582,551 318,551 236,300"/>
    <polygon points="450,190 621,314 556,515 344,515 279,314"/>
    <polygon points="450,235 578,328 529,479 371,479 322,328"/>
    <polygon points="450,280 535,342 503,443 397,443 365,342"/>
    <line x1="450" y1="360" x2="450" y2="145"/>
    <line x1="450" y1="360" x2="664" y2="300"/>
    <line x1="450" y1="360" x2="582" y2="551"/>
    <line x1="450" y1="360" x2="318" y2="551"/>
    <line x1="450" y1="360" x2="236" y2="300"/>
  </g>

  <!-- equal-radius focus polygon: no proficiency scoring -->
  <polygon points="450,190 621,314 556,515 344,515 279,314"
           fill="#238636" fill-opacity="0.22" stroke="#3fb950" stroke-width="4"/>

  <g fill="#3fb950">
    <circle cx="450" cy="190" r="7"/>
    <circle cx="621" cy="314" r="7"/>
    <circle cx="556" cy="515" r="7"/>
    <circle cx="344" cy="515" r="7"/>
    <circle cx="279" cy="314" r="7"/>
  </g>

  <g fill="#f0f6fc" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
    <text x="450" y="132" text-anchor="middle">Backend</text>
    <text x="704" y="305" text-anchor="start">Frontend</text>
    <text x="620" y="585" text-anchor="middle">Data</text>
    <text x="280" y="585" text-anchor="middle">Databases</text>
    <text x="196" y="305" text-anchor="end">Dev Tools</text>
  </g>

  <text x="450" y="622" text-anchor="middle" fill="#8b949e" font-family="Arial, Helvetica, sans-serif" font-size="14">
    Visual map of areas I work with — not a proficiency score
  </text>
</svg>
