<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="235" viewBox="0 0 1200 235">
  <style>
    .h{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f0f3f6}
    .b{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#b7bdc8}
    .a{fill:#d6c0ab}
    .m{fill:none;stroke:#d6c0ab;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <g transform="translate(28 24)">
    <circle class="a" cx="18" cy="18" r="18" opacity=".16"/>
    <circle class="m" cx="18" cy="12" r="6"/>
    <path class="m" d="M7 31c2.5-7 19.5-7 22 0"/>
    <text class="h" x="50" y="27">Who I Am</text>
    <text class="b" x="0" y="73">I'm Manal, a Full-Stack Developer focused on building reliable</text>
    <text class="b" x="0" y="102">web applications from back end to front end.</text>
    <text class="b" x="0" y="143">I enjoy strengthening my back-end skills while also paying attention</text>
    <text class="b" x="0" y="172">to UI/UX, testing, and deployment.</text>
  </g>
  <g transform="translate(790 24)">
    <circle class="a" cx="18" cy="18" r="18" opacity=".16"/>
    <circle class="m" cx="18" cy="18" r="11"/>
    <circle class="m" cx="18" cy="18" r="4"/>
    <path class="m" d="M26 10l9-9M29 1h6v6"/>
    <text class="h" x="50" y="27">Current Focus</text>
    <rect class="m" x="0" y="61" width="10" height="10" rx="1"/>
    <text class="b" x="24" y="72">Solidifying back-end craftsmanship</text>
    <text class="b" x="24" y="100">with Java, Spring Boot, and Django</text>
    <rect class="m" x="0" y="122" width="10" height="10" rx="1"/>
    <text class="b" x="24" y="133">Shipping polished UI/UX and deployable demos</text>
    <rect class="m" x="0" y="163" width="10" height="10" rx="1"/>
    <text class="b" x="24" y="174">Writing tests and CI workflows to improve quality</text>
  </g>
