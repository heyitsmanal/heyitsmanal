name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate beige contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-beige.svg?palette=github-light&color_snake=%23755F50&color_dots=%23F5F2EF,%23E8DED7,%23D6C3B7,%23B89E8C,%23755F50
            dist/github-contribution-grid-snake-beige-dark.svg?palette=github-dark&color_snake=%23DCC9BA&color_dots=%23161B22,%23372F2A,%236E584B,%23AA8E7D,%23DCC9BA

      - name: Publish snake files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
