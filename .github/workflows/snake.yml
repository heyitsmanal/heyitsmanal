name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg {"color_snake":"#5B7C99","color_dots":["#EAF0F5","#DCE6EE","#B7CBD9","#8FB3CC","#5B7C99"]}
            dist/github-contribution-grid-snake-dark.svg {"palette":"github-dark","color_snake":"#8FB3CC","color_dots":["#1E2A33","#314657","#4D6C83","#6D91A9","#8FB3CC"]}

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
