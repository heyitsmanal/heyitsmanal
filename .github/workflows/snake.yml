# Refresh the beige snake

After uploading this version to your `heyitsmanal/heyitsmanal` profile repository:

1. Commit `.github/workflows/snake.yml` and the updated `README.md`.
2. Open **Actions** → **Generate contribution snake**.
3. Click **Run workflow** → **Run workflow**.
4. Wait for the workflow to finish successfully.
5. Refresh your profile. If GitHub/raw-content caching keeps the old image briefly, hard-refresh once.

This version intentionally uses new output filenames (`...snake-beige.svg` and `...snake-beige-dark.svg`) so an older cached snake is not reused.
