name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%235B7C99&color_dots=%23EAF0F5,%23DCE6EE,%23B7CBD9,%238FB3CC,%235B7C99
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%238FB3CC&color_dots=%231E2A33,%23314657,%234D6C83,%236D91A9,%238FB3CC

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
